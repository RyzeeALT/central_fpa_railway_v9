{% extends "admin/base_admin.html" %}
{% block admin_content %}<div class="admin-title"><div><h1>{{ 'Editar acesso' if link.id else 'Novo acesso' }}</h1><p>Use as categorias para definir onde o item aparece: Central, Vídeos Tutoriais ou Bancos mais utilizados.</p></div></div>
<form class="panel form-grid" method="post" enctype="multipart/form-data"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Nome do acesso<input name="title" required maxlength="160" value="{{ link.title or '' }}"></label><label>Categoria<select name="category_id" required>{% for cat in categories %}<option value="{{ cat.id }}" {{ 'selected' if link.category_id == cat.id else '' }}>{{ cat.name }}</option>{% endfor %}</select></label><label class="wide">Endereço (URL)<input type="url" name="url" placeholder="https://..." value="{{ link.url or '' }}"><small>Itens sem endereço ficam salvos, mas não podem ser publicados.</small></label><label class="wide">Descrição<textarea name="description" rows="4" maxlength="400">{{ link.description or '' }}</textarea></label><label>Ícone interno<input name="icon" value="{{ link.icon or 'external-link' }}" placeholder="external-link"></label><label>Ordem de exibição<input type="number" name="sort_order" value="{{ link.sort_order or 0 }}"><small>Menores números aparecem primeiro dentro da categoria.</small></label>
<div class="wide image-fields"><label>Imagem por URL<input type="text" name="image_url" value="{{ link.image_url or '' }}" placeholder="https://... ou /static/..."><small>Você pode manter uma URL externa ou usar o upload abaixo.</small></label><label>Enviar imagem do computador<input type="file" name="image_file" accept="image/png,image/jpeg,image/webp"><small>PNG, JPG ou WEBP, até 2 MB. O arquivo enviado tem prioridade sobre a URL. {% if storage_backend == 'railway-volume' %}Em produção, o arquivo é salvo no Volume persistente da Railway.{% else %}Neste ambiente, o arquivo fica salvo localmente.{% endif %}</small></label>{% if link.image_url %}<div class="image-preview"><span>Prévia atual</span><img src="{{ link.image_url }}" alt="Prévia da imagem do acesso"></div>{% endif %}</div>
<div class="checks"><label><input type="checkbox" name="is_active" {{ 'checked' if link.is_active else '' }}> Publicar na central</label><label><input type="checkbox" name="is_beta" {{ 'checked' if link.is_beta else '' }}> Identificar como Beta</label></div><div class="wide form-actions"><button class="primary">Salvar acesso</button><a class="secondary" href="{{ url_for('admin.links') }}">Cancelar</a></div></form>{% endblock %}
