{% extends "admin/base_admin.html" %}{% block title %}Minha conta · Central FP&A{% endblock %}{% block admin_content %}
<div class="admin-title"><div><span class="eyebrow blue">SEGURANÇA</span><h1>Minha conta</h1><p>Atualize seus dados e sua senha administrativa.</p></div></div>
<div class="two-panels"><form class="panel form-grid one-col" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="action" value="profile"><h2>Dados do perfil</h2><label>Nome<input name="name" value="{{ current_user.name }}" required></label><label>E-mail<input value="{{ current_user.email }}" disabled><small>O e-mail de login não é alterado por esta tela.</small></label><button class="primary">Salvar perfil</button></form><form class="panel form-grid one-col" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="action" value="password"><h2>Alterar senha</h2><label>Senha atual<input type="password" name="current_password" required autocomplete="current-password"></label><label>Nova senha<input type="password" name="new_password" minlength="12" required autocomplete="new-password"></label><label>Confirmar nova senha<input type="password" name="confirm_password" minlength="12" required autocomplete="new-password"></label><button class="primary">Alterar senha</button></form></div>{% endblock %}
